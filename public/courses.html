<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses - VertexLearn AI</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="nav-brand">
        <span>🎓</span>
        <span>VertexLearn</span>
        <span class="brand-badge">AI</span>
      </a>

      <button class="mobile-menu-btn" aria-label="Toggle Navigation">☰</button>

      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/courses.html" class="active">Courses</a></li>
        <li><a href="/tutor.html">AI Tutor</a></li>
        <li><a href="/study-tools.html">Study Tools</a></li>
      </ul>

      <div class="nav-actions">
        <!-- Dynamic based on login -->
      </div>
    </div>
  </header>

  <!-- Courses Page Header -->
  <main class="container" style="margin-top: 30px; margin-bottom: 60px;">
    <div style="margin-bottom: 30px;">
      <h1 style="font-size: 30px; font-weight: 800; color: var(--text-main);">Explore Curriculum</h1>
      <p style="color: var(--text-muted); font-size: 16px; margin-top: 6px;">
        Practical, industry-aligned lessons from web fundamentals to backend architecture and artificial intelligence.
      </p>
    </div>

    <!-- Alert Box -->
    <div id="coursesAlert"></div>

    <!-- Search & Filter Bar -->
    <div style="background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 18px 20px; margin-bottom: 28px; display: flex; flex-direction: column; gap: 14px;">
      
      <!-- Search Input -->
      <div style="position: relative;">
        <span style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 16px;">🔍</span>
        <input 
          type="text" 
          id="courseSearchInput" 
          class="form-control" 
          placeholder="Search by course topic, technology, or keywords (e.g. Flexbox, Mongoose, Gemini, REST)..." 
          style="padding-left: 42px; font-size: 14px; height: 44px;"
        >
      </div>

      <!-- Filter Buttons & Level Selector -->
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
        <div style="display: flex; gap: 8px; flex-wrap: wrap;" id="categoryFilterContainer">
          <button class="chip active-filter" data-cat="all">All Disciplines</button>
          <button class="chip" data-cat="Frontend">Frontend</button>
          <button class="chip" data-cat="JavaScript">JavaScript</button>
          <button class="chip" data-cat="Backend">Backend &amp; DB</button>
          <button class="chip" data-cat="AI">Artificial Intelligence</button>
        </div>

        <div style="display: flex; align-items: center; gap: 8px;">
          <label for="levelFilterSelect" style="font-size: 13px; font-weight: 600; color: var(--text-muted);">Level:</label>
          <select id="levelFilterSelect" class="form-control" style="width: auto; padding: 6px 12px; font-size: 13px; height: auto;">
            <option value="all">All Levels</option>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
        </div>
      </div>

    </div>

    <!-- Course Cards Grid -->
    <div id="coursesGrid" class="grid-3">
      <div class="card" style="grid-column: 1 / -1; text-align: center; padding: 40px;">
        <p style="color: var(--text-muted);">Loading courses...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>VertexLearn AI &copy; 2026 &mdash; Built with HTML, CSS, JavaScript, Express &amp; MongoDB</p>
    </div>
  </footer>

  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/courses.js"></script>
</body>
</html>
